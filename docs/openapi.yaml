openapi: 3.0.3
info:
  title: Hapa API
  version: 1.0.0
  description: Production API for location-based community incident awareness. API v1 includes the small engagement extension for views, helpful reactions and share events.
servers:
  - url: http://127.0.0.1:8000/v1
paths:
  /health:
    get:
      summary: Service health
      responses:
        '200': {description: Healthy}
        '503': {description: Degraded}
  /categories:
    get:
      summary: List enabled categories
      responses: {'200': {description: OK}}
  /modes:
    get:
      summary: List active modes
      responses: {'200': {description: OK}}
  /auth/register:
    post:
      summary: Register user
      responses: {'201': {description: Created}, '422': {description: Validation error}}
  /auth/login:
    post:
      summary: Login user
      responses: {'200': {description: Tokens issued}, '401': {description: Invalid credentials}}
  /auth/refresh:
    post:
      summary: Refresh access token
      responses: {'200': {description: Token refreshed}}
  /flashes:
    get:
      summary: Nearby flashes with cursor pagination
      parameters:
        - {name: lat, in: query, required: true, schema: {type: number}}
        - {name: lng, in: query, required: true, schema: {type: number}}
        - {name: cursor, in: query, schema: {type: string}}
      responses: {'200': {description: OK}}
    post:
      summary: Create flash
      security: [{bearerAuth: []}]
      responses: {'201': {description: Created}, '409': {description: Matching report already posted recently}}
  /flashes/{id}/helpful:
    post:
      summary: Mark a flash as helpful
      security: [{bearerAuth: []}]
      responses: {'200': {description: Engagement updated}}
    delete:
      summary: Remove the current user's helpful reaction
      security: [{bearerAuth: []}]
      responses: {'200': {description: Engagement updated}}
  /flashes/{id}/share:
    post:
      summary: Record a share action before the client opens its native share sheet
      security: [{bearerAuth: []}]
      responses: {'200': {description: Engagement updated}}
  /flashes/{id}/observations:
    post:
      summary: Confirm or clear a flash
      security: [{bearerAuth: []}]
      responses: {'200': {description: Updated}}
  /flashes/{id}/reports:
    post:
      summary: Report a flash
      security: [{bearerAuth: []}]
      responses: {'201': {description: Created}, '409': {description: Duplicate report}}
  /admin/auth/login:
    post:
      summary: Admin login
      responses: {'200': {description: Admin token}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}